[workspace]
resolver = "3"
members = [
    "crates/ostinato-domain",
    "crates/ostinato-lang",
    "crates/ostinato-application",
    "crates/ostinato-adapters",
    "crates/ostinato-cli",
]

[workspace.package]
version = "0.7.5"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/periplon/ostinato"
homepage = "https://github.com/periplon/ostinato"
description = "A CUE-compatible, durable, observable and agentic workflow language and engine."
keywords = ["workflow", "cue", "agent", "durability", "orchestration"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
wait-timeout = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
