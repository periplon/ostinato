[package]
name = "ostinato-adapters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Infrastructure adapters for Ostinato: SQLite journal, processes, agents, telemetry."

[dependencies]
ostinato-domain = { path = "../ostinato-domain" }
ostinato-application = { path = "../ostinato-application" }
ostinato-lang = { path = "../ostinato-lang" }
serde = { workspace = true }
serde_json = { workspace = true }
saphyr = "0.3.3"
saphyr-parser = "0.3.3"
thiserror = { workspace = true }
rusqlite = { workspace = true }
wait-timeout = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
glob = { workspace = true }
libc = { workspace = true }
walkdir = { workspace = true }
bigdecimal = "0.4.11"
num-bigint = { workspace = true }
tempfile = { workspace = true }
unicode-normalization = { workspace = true }
rustix = { version = "1", features = ["fs"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[lints]
workspace = true
